version: '3.8'

services:
  app:
    build: .
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/portifolio
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Vini-sousa-123
    depends_on:
      - db


  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: portifolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Vini-sousa-123
    ports:
      - "5432:5432"